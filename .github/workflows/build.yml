name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # 与 Steam 稳定版保持一致
  TML_VERSION: v2026.08.3.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: TerraNoneBridge

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Download tModLoader
        run: |
          curl -sSfL -o tModLoader.zip "https://github.com/tModLoader/tModLoader/releases/download/${TML_VERSION}/tModLoader.zip"
          unzip -q tModLoader.zip -d tModLoader
          # TerraNoneBridge.csproj 引用上级目录的 tModLoader.targets
          cat > tModLoader.targets <<'EOF'
          <Project ToolsVersion="14.0" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <Import Project="tModLoader/tMLMod.targets" />
          </Project>
          EOF

      - name: Build mod
        run: |
          # 与 tModLoader 的 LaunchUtils/EnvironmentFix.sh 一致：打包时转换图标需要 FNA3D 原生库
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/tModLoader/Libraries/Native/Linux"
          ln -sf "$LD_LIBRARY_PATH/libSDL2-2.0.so.0" "$LD_LIBRARY_PATH/libSDL2.so"
          dotnet build TerraNoneBridge/TerraNoneBridge.csproj -c Release "-p:ExtraBuildModFlags=-tmlsavedirectory $GITHUB_WORKSPACE/tmlsave"

      - uses: actions/upload-artifact@v7
        with:
          name: TerraNoneBridge
          path: tmlsave/Mods/TerraNoneBridge.tmod
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: tmlsave/Mods/TerraNoneBridge.tmod
          body_path: TerraNoneBridge/changelog.txt
